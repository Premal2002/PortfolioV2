<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Square tile — Quinn editorial theme: near-black ink on cream -->

  <!-- Solid square background -->
  <rect x="0" y="0" width="64" height="64" fill="#16150f" />

  <!-- Inset hairline frame -->
  <rect x="5" y="5" width="54" height="54" fill="none" stroke="rgba(244,241,234,0.28)" stroke-width="2" />

  <!-- PK text — centered, bold cream -->
  <text
    x="32"
    y="32"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Arial Black', 'Segoe UI', Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#f4f1ea"
    letter-spacing="-1"
  >PK</text>

</svg>
